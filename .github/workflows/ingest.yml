# Pulls new Google Voice texts from Gmail, grades them, and writes them to Supabase
# every 10 minutes. Add these repository secrets: GMAIL_USER, GMAIL_APP_PASSWORD,
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and optionally ANTHROPIC_API_KEY,
# GHL_TOKEN, GHL_LOCATION_ID. Then add the repository variable INGEST_ENABLED=true.
name: ingest texts
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency: ingest
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Stays idle until the Gmail and Supabase secrets are added.
    if: ${{ vars.INGEST_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install anthropic
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python -m sifter run --days 2
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
